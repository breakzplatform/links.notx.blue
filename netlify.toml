# Vite builds the static site into dist/; Netlify publishes that directory and
# never sees the sources. The Tailwind CSS is compiled ahead of time and
# committed (scripts/build-css.sh), so the build only bundles it: no Tailwind
# run, no design-system files and no scripts/ reach the CDN.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The only server code: the stateless image proxy at /api/image-proxy. Its
# route and rate limit live in the function's own `config` export.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The privacy policy is shared by every notx.blue app, so this site has none
# of its own. Netlify serves dist/404.html for other unknown paths.
[[redirects]]
  from = "/privacy"
  to = "https://notx.blue/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "https://notx.blue/privacy"
  status = 301
  force = true

# The CSP allows only this origin for scripts and styles (Vite emits no inline
# code; theme-boot.js is a file for that reason). Images and connections are
# open to https because link icons, favicons (cardyb) and each user's PDS live
# on arbitrary hosts. Fonts come from the design system's asset host.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://cdn.jsdelivr.net https://cardyb.bsky.app https:; connect-src 'self' https://cardyb.bsky.app https://*.bsky.network https://bsky.social https://public.api.bsky.app https://plc.directory https:; font-src 'self' https://static.joseli.to; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"

# Vite puts a content hash in every file name under /assets/, so a changed
# file always gets a new URL and these can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify has no type for .webmanifest and would send application/octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
