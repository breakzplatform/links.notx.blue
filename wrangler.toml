name = "links-notx-blue"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "links.notx.blue", custom_domain = true }]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "IMAGE_PROXY_LIMITER"
namespace_id = "48213"
simple = { limit = 30, period = 60 }
