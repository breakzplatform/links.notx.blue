<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Colours are the project's green ink (links-ink in scripts/tailwind-input.css),
       paper and black, inlined: an SVG loaded as an image cannot read CSS custom properties. -->
  <rect width="100" height="100" fill="#2E6B3F"/>
  <!-- Card plus its hard shadow spans 18..82 before scaling. Scaled down around the
       centre so its corners stay inside the maskable safe zone and circular crops. -->
  <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
    <rect x="26" y="26" width="56" height="56" fill="#000"/>
    <rect x="18" y="18" width="56" height="56" fill="#000"/>
    <rect x="22" y="22" width="48" height="48" fill="#F4F1EA"/>
    <!-- lucide-static 0.542.0 link.svg, scaled into the card. -->
    <g transform="translate(29.2 29.2) scale(1.4)" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </g>
  </g>
</svg>
