      <p lang="pt-BR">Tudo acontece no seu navegador. Os tokens OAuth ficam no IndexedDB deste navegador. Este site não guarda conta, token nem ícone. O único código no servidor é um proxy de imagem sem estado e sem logs. Ícones salvos viram blobs públicos no seu repositório Bluesky.</p>
